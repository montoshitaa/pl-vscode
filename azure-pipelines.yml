
trigger: none
pr:
  - dev
  - main

pool:
  vmImage: ubuntu-latest

steps:
  # 1. Configurar Node.js
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: Use Node 22

  # 2. Comprobar versión
  - script: |
      set -euo pipefail
      tag="${BUILD_SOURCEBRANCH#refs/tags/v}"
      version="$(node -p "require('./package.json').version")"
      test "$tag" = "$version"
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    displayName: Check tag matches package version

  # 3. Instalar dependencias
  - script: npm ci
    displayName: Install dependencies

  # 4. Instalar VSCE
  - script: |
      npm install -g @vscode/vsce
      vsce --version
    displayName: Install VS Code Extension Manager

  # 5. Compilar y empaquetar
  - script: npm run package
    displayName: Build and package VSIX

  # 6. Ejecutar pruebas
  - script: npm run smoke:server
    displayName: Smoke test bundled server

  - script: npm run smoke:cli
    displayName: Smoke test bundled CLI

  - script: npm run test:guard
    displayName: Unit test run guards

  # 7. Localizar el archivo VSIX
  - script: |
      set -euo pipefail
      version="$(node -p "require('./package.json').version")"
      vsix="placitum-vscode-${version}.vsix"
      test -f "$vsix"
      echo "##vso[task.setvariable variable=vsixPath]${vsix}"
    displayName: Locate VSIX

  - script: |
      set -euo pipefail
      count=$(unzip -l "$(vsixPath)" | grep -cE 'extension/server/(dist/(bin|placitum)\.js|package\.json)')
      test "$count" -eq 3
    displayName: Check bundled server and CLI in VSIX

  # 8. Guardar el VSIX
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: $(vsixPath)
      artifact: vsix
    displayName: Upload VSIX artifact

  - task: AzureCLI@2
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    displayName: Publish using managed identity
    inputs:
      azureSubscription: 'placitum-marketplace'
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        $ErrorActionPreference = 'Stop'

        vsce publish --azure-credential --packagePath "$(vsixPath)" --skip-duplicate

        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }